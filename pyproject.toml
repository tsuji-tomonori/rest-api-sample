[project]
name = "rest-api-sample"
version = "1.0.0"
description = "修理依頼を題材に学ぶ REST API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.16.5",
    "boto3==1.40.46",
    "fastapi==0.135.1",
    "mangum==0.19.0",
    "psycopg[binary]==3.2.13",
    "pydantic==2.12.5",
    "SQLAlchemy==2.0.49",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
    "uvicorn==0.40.0",
]
contract = [
    "schemathesis==4.33.4",
]
infra = [
    "aws-cdk-lib==2.220.0",
    "constructs>=10,<11",
]

[tool.uv]
package = false
