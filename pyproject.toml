[project]
name = "rest-api-sample"
version = "1.0.0"
description = "修理依頼を題材に学ぶ REST API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.16.5",
    "boto3==1.40.46",
    "fastapi==0.135.1",
    "mangum==0.19.0",
    "psycopg[binary]==3.2.13",
    "pydantic==2.12.5",
    "SQLAlchemy==2.0.49",
]

[dependency-groups]
dev = [
    "boto3-stubs[lambda,secretsmanager]==1.40.46",
    "httpx==0.28.1",
    "mypy==1.14.1",
    "PyYAML>=6,<7",
    "pytest==9.0.3",
    "ruff==0.15.22",
    "types-PyYAML>=6,<7",
    "uvicorn==0.40.0",
]
contract = [
    "hypothesis>=6.130.12,<7",
    "requests>=2.22,<3",
    "schemathesis==4.33.4",
]
infra = [
    "aws-cdk-lib==2.253.0",
    "cdk-nag>=2.35,<3",
    "constructs>=10,<11",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["package", "scripts"]
explicit_package_bases = true
check_untyped_defs = true
warn_redundant_casts = true
