name: Deploy to AWS
on:
  workflow_run:
    workflows: [Verify sample]
    branches: [main]
    types: [completed]

permissions: {}

jobs:
  candidate:
    if: >-
      github.event.workflow.path == '.github/workflows/verify.yml' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Check that the verified revision is still on main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          HAS_TARGET: ${{ vars.AWS_ROLE_ARN != '' }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$VERIFIED_SHA" != "$latest" ]]; then
            echo "reason=newer_revision" >> "$GITHUB_OUTPUT"
            echo "A newer revision is on main; skipping this deployment." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$HAS_TARGET" != "true" ]]; then
            echo "reason=aws_target_not_configured" >> "$GITHUB_OUTPUT"
            echo "Verified CI revision $VERIFIED_SHA. AWS_ROLE_ARN is not configured; deployment skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.head.outputs.reason != ''
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record why AWS checks were not run
        if: steps.head.outputs.reason != ''
        env:
          REASON: ${{ steps.head.outputs.reason }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python -m package.infra.smoke_report "$RUNNER_TEMP/aws-smoke.json" "$REASON"
      - name: Publish the AWS check report
        if: steps.head.outputs.reason != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aws-smoke-report
          path: ${{ runner.temp }}/aws-smoke.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  deploy:
    needs: candidate
    if: needs.candidate.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: aws
    concurrency:
      group: repair-api-aws-deploy
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    env:
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Check deployment configuration
        run: |
          if [[ -z "$AWS_REGION" ]]; then
            echo "::error::Set the AWS_REGION repository variable before deploying."
            exit 1
          fi
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.10.0'
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Prepare the verified revision
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          uv sync --locked --group infra
      - name: Recheck main after acquiring the deployment slot
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$VERIFIED_SHA" == "$latest" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer revision is on main; skipping this deployment."
          fi
      - name: Assume the deployment role using OIDC
        if: steps.release.outputs.current == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: RepairApi-${{ github.run_id }}
      - name: Deploy the stack and record its outputs
        id: stack
        if: steps.release.outputs.current == 'true'
        working-directory: package/infra
        run: |
          npx --yes --package=aws-cdk@2.1148.1 cdk deploy RepairApi \
            --require-approval never --no-lookups \
            --parameters "DeploymentRoleName=${DEPLOY_ROLE_ARN##*/}" \
            --outputs-file "$RUNNER_TEMP/repair-outputs.json"
      - name: Apply migrations and verify AWS IAM, list and validation responses
        id: smoke
        if: steps.release.outputs.current == 'true'
        run: >-
          uv run --locked --group infra python -m package.infra.post_deploy
          "$RUNNER_TEMP/repair-outputs.json" --report "$RUNNER_TEMP/aws-smoke.json"
      - name: Record an interrupted deployment before smoke testing
        if: always()
        env:
          STACK_OUTCOME: ${{ steps.stack.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          report="$RUNNER_TEMP/aws-smoke.json"
          if [[ -s "$report" ]]; then exit 0; fi
          reason=preparation_failed
          if [[ "$STACK_OUTCOME" == failure || "$STACK_OUTCOME" == cancelled ]]; then
            reason=deployment_failed
          elif [[ "$JOB_STATUS" == success ]]; then
            reason=newer_revision
          fi
          if [[ -f package/infra/smoke_report.py ]]; then
            python -m package.infra.smoke_report "$report" "$reason"
          else
            # Even a checkout failure can be reported without running repository code.
            jq -n --arg revision "$VERIFIED_SHA" '{schema_version:1,target:"aws",status:"failed",reason:"preparation_failed",revision:$revision,checks:[]}' > "$report"
            echo "## AWS 実環境の疎通確認" >> "$GITHUB_STEP_SUMMARY"
            echo "準備に失敗したため、AWS の疎通確認は未実行です。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish the AWS check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aws-smoke-report
          path: ${{ runner.temp }}/aws-smoke.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
