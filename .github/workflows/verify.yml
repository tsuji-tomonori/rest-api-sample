name: Generate uv lock
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.0'
          enable-cache: false
      - run: uv lock
      - uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
      - name: Print checksum and compressed lock for verification
        run: |
          sha256sum uv.lock
          gzip -nc uv.lock | base64 -w 1800 | sed 's/^/LOCK-CHUNK /'
