name: Verify sample
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: repairs_ci
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.0'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate CI and CD workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color .github/workflows/*.yml
      - name: Install locked application, test and infrastructure dependencies
        run: uv sync --locked --group infra
      - name: Lint Python with Ruff
        run: uv run --locked --group infra ruff check package scripts tests
      - name: Check application, migration and infrastructure types
        run: uv run --locked --group infra mypy
      - name: Run isolated unit tests
        run: uv run --locked --group infra python -m pytest -q tests/unit
      - name: Test the FastAPI routes using SQLite
        run: uv run --locked --group infra python -m pytest -q tests/test_api.py
      - name: Check migrations and permissions on PostgreSQL
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-only@127.0.0.1:5432/repairs_ci
        run: uv run --locked --group infra python -m pytest -q tests/test_postgres.py
      - name: Check migration and smoke-test handling for CD
        run: uv run --locked --group infra python -m pytest -q tests/test_deployment.py
      - name: Compare the published YAML and JSON contracts with FastAPI
        run: uv run --locked --group infra python -m package.app.export_openapi --check docs/openapi.yaml docs/openapi.json
      - name: Synthesize the infrastructure
        working-directory: package/infra
        run: npx --yes --package=aws-cdk@2.1148.1 cdk synth RepairApi --no-lookups --quiet
      - name: Build the image staged by CDK
        run: |
          dockerfile=$(find package/infra/cdk.out -type f -name Dockerfile -print -quit)
          test -n "$dockerfile"
          docker build --platform linux/amd64 --provenance=false -t repair-sample "$(dirname "$dockerfile")"
      - name: Import the packaged Lambda handlers
        run: >-
          docker run --rm --entrypoint python repair-sample -c
          'from package.app.main import handler; from package.db.migrate import handler as migrate'

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.0'
          enable-cache: true
      - name: Start the API and PostgreSQL and wait for readiness
        run: docker compose up --build --wait --wait-timeout 180 api
      - name: Run the business flow over HTTP
        run: docker compose run --rm integration
      - name: Send OpenAPI YAML examples to the API and verify the responses
        run: uv run --locked --group contract python tests/contract/check.py
      - name: Show that changing only the YAML expectation fails the live test
        run: |
          uv run --locked --group contract python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import yaml

          with tempfile.TemporaryDirectory() as directory:
              path = Path(directory) / "wrong.yaml"
              document = yaml.safe_load(Path("docs/openapi.yaml").read_text())
              media = document["paths"]["/repair-requests"]["post"]["requestBody"]["content"]["application/json"]
              media["examples"]["office-chair"]["x-expected-fields"]["title"] = "unexpected title"
              path.write_text(yaml.safe_dump(document, allow_unicode=True))
              result = subprocess.run(
                  [sys.executable, "tests/contract/check.py", "--contract", str(path)],
                  capture_output=True, text=True,
              )
              assert result.returncode != 0 and "POST office-chair: expected title=" in result.stderr, result.stderr
              print("A changed YAML expectation failed at the POST response title, as expected.")
          PY
      - name: Show container status and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=80
      - name: Remove the disposable Compose project
        if: always()
        run: docker compose down --volumes
