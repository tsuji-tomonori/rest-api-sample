name: Resolve test dependencies
on: push
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.0'
          enable-cache: false
      - run: uv lock
      - name: Share the resolved dependency lock
        run: |
          sha256sum uv.lock
          gzip -nc uv.lock | base64 -w 1400 | sed 's/^/LOCK-CHUNK /'
