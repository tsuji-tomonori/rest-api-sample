name: Inspect infrastructure
on: [push]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.0'
      - run: uv lock && uv sync --locked --group infra
      - name: Collect baseline
        run: |
          git diff -- uv.lock > /tmp/lock.patch
          uv run --locked --group infra python - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          from aws_cdk import App, Aspects
          from cdk_nag import AwsSolutionsChecks
          from package.infra.app import RepairApiStack
          app=App(outdir="/tmp/repair-inspection",context={"auroraVersion":"17.7"})
          stack=RepairApiStack(app,"RepairApi")
          Aspects.of(stack).add(AwsSolutionsChecks())
          assembly=app.synth()
          template=assembly.get_stack_by_name("RepairApi").template
          for name,data in [("snapshot",json.dumps(template).encode()),("lock",Path("/tmp/lock.patch").read_bytes()),("nag",next(Path(assembly.directory).glob("*.csv")).read_bytes())]:
              print("DATA_"+name+"="+base64.b64encode(gzip.compress(data)).decode())
          PY
      - name: Audit packages
        run: |
          uv export --locked --all-groups --no-emit-project --no-hashes -o /tmp/requirements.txt >/dev/null
          uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip
