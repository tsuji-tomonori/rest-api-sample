<svg xmlns="http://www.w3.org/2000/svg" width="850" height="672" viewBox="0 0 850 672" role="img" aria-labelledby="title desc" lang="ja">
  <title id="title">修理依頼 API の AWS 構成</title>
  <desc id="desc">クライアントが HTTPS で送った IAM 署名付きリクエストを API Gateway が検証し、FastAPI を実行する Lambda を呼ぶ。Lambda はアプリ用の VPC に接続する。隔離サブネット内の接続口から、Aurora PostgreSQL へ TCP 5432 で接続し、Secrets Manager へは VPC エンドポイントを経由して HTTPS 443 で DB 認証情報を取得する。</desc>
  <metadata>AWS service icons © Amazon Web Services, Inc. or its affiliates.
    Source: https://github.com/awslabs/aws-icons-for-plantuml/tree/v23.1
    License: https://creativecommons.org/licenses/by-nd/2.0/</metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#25485a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text {font-family: "Yu Gothic", Meiryo, "Noto Sans CJK JP", sans-serif; fill: #203c48}
    .name {font-size: 22px; font-weight: 700}
    .detail {font-size: 16px}
    .group {font-size: 20px; font-weight: 700}
    .subgroup {font-size: 18px; font-weight: 700; fill: #215d54}
    .edge {fill: none; stroke: #25485a; stroke-width: 2.6; marker-end: url(#arrow)}
    .label {font-size: 16px; font-weight: 600; fill: #25485a}
    .service {fill: #fff; stroke: #65818f; stroke-width: 1.5}
    .private {fill: #fff; stroke: #4e8477; stroke-width: 1.5}
  </style>
  <rect width="850" height="672" rx="12" fill="#fff"/>
  <rect x="17" y="119" width="816" height="536" rx="15" fill="#f4f8fa" stroke="#647f8d" stroke-width="2"/>
  <text x="39" y="151" class="group">AWS クラウド</text>

  <rect x="40" y="280" width="770" height="278" rx="11" fill="#eaf4f0" stroke="#4e8477" stroke-width="2"/>
  <text x="59" y="311" class="group">アプリ用の VPC</text>
  <rect x="58" y="326" width="734" height="215" rx="9" fill="#f5faf7" stroke="#699488" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="78" y="354" class="subgroup">隔離サブネット</text>

  <rect x="49" y="16" width="295" height="67" rx="9" fill="#f5f3ed" stroke="#908568" stroke-width="1.5"/>
  <text x="67" y="45" class="name">クライアント</text>
  <text x="67" y="69" class="detail">AWS の認証情報で署名して送信</text>
  <path d="M 220 83 V 173" class="edge"/>
  <text x="235" y="107" class="label">HTTPS</text>

  <rect x="48" y="177" width="304" height="72" rx="9" class="service"/>
  <image x="60" y="190" width="44" height="44" href="data:image/png;base64,"/>
  <text x="114" y="209" class="name">API Gateway</text>
  <text x="114" y="234" class="detail">HTTP API で署名・権限を確認</text>
  <path d="M 352 213 H 495" class="edge"/>
  <text x="423" y="199" class="label" text-anchor="middle">関数を呼び出す</text>

  <rect x="500" y="177" width="279" height="72" rx="9" class="service"/>
  <image x="512" y="190" width="44" height="44" href="data:image/png;base64,"/>
  <text x="566" y="209" class="name">API 用 Lambda</text>
  <text x="566" y="234" class="detail">FastAPI で依頼を処理</text>
  <path d="M 635 249 V 368" class="edge"/>
  <text x="650" y="271" class="label">VPC に接続</text>

  <rect x="500" y="372" width="269" height="63" rx="8" class="private"/>
  <text x="516" y="398" class="name">Lambda の接続口</text>
  <text x="516" y="421" class="detail">ネットワークインターフェイス</text>
  <path d="M 500 404 H 339" class="edge"/>
  <text x="408" y="390" class="label" text-anchor="middle">TCP 5432</text>
  <text x="408" y="429" class="detail" text-anchor="middle">依頼を読み書き</text>
  <rect x="78" y="372" width="257" height="70" rx="8" class="private"/>
  <image x="90" y="385" width="44" height="44" href="data:image/png;base64,"/>
  <text x="141" y="402" class="name" style="font-size:19px">Aurora PostgreSQL</text>
  <text x="141" y="427" class="detail">修理依頼を保存</text>

  <path d="M 635 435 V 480" class="edge"/>
  <text x="649" y="464" class="label">HTTPS 443</text>
  <rect x="500" y="484" width="269" height="44" rx="8" class="private"/>
  <text x="516" y="514" class="name">VPC エンドポイント</text>
  <path d="M 635 528 V 582" class="edge"/>
  <rect x="500" y="586" width="279" height="55" rx="9" class="service"/>
  <image x="511" y="594" width="39" height="39" href="data:image/png;base64,"/>
  <text x="560" y="611" class="name">Secrets Manager</text>
  <text x="560" y="633" class="detail">DB の認証情報を保管</text>
</svg>
